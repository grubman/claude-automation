# Copy to .github/workflows/claude-review.yml in your repo and adjust the marked lines.
name: Claude PR Review

on:
  workflow_run:
    workflows: [CI]                      # ← names (not files) of the workflows that test PRs
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:                        # ← same paths those workflows run on: such PRs are reviewed after CI
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true

jobs:
  review:
    uses: grubman/claude-automation/.github/workflows/review.yml@v1
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    with:
      ci_workflows: ci.yml                                         # ← file names, space-separated
      ci_paths_regex: '^(src/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'   # ← mirror of paths-ignore
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AUTOMATION_PAT: ${{ secrets.AUTOMATION_PAT }}
